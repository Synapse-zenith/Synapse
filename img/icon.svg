<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4c5f0"/>
      <stop offset="50%" style="stop-color:#b8a9d4"/>
      <stop offset="100%" style="stop-color:#a8d8ea"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#f0ebff;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b8ec4"/>
      <stop offset="100%" style="stop-color:#7b6db0"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8d8ea"/>
      <stop offset="100%" style="stop-color:#6ab0cc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#7b6db0" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="128" x2="512" y2="128" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#fff" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Central hub node -->
  <circle cx="256" cy="256" r="72" fill="url(#innerGrad)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="52" fill="url(#nodeGrad1)" opacity="0.85"/>
  <circle cx="256" cy="256" r="28" fill="url(#nodeGrad2)" opacity="0.9"/>

  <!-- Connecting lines (synapses) -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="256" y1="184" x2="256" y2="100"/>
    <line x1="256" y1="328" x2="256" y2="412"/>
    <line x1="184" y1="256" x2="100" y2="256"/>
    <line x1="328" y1="256" x2="412" y2="256"/>
    <line x1="205" y1="205" x2="146" y2="146"/>
    <line x1="307" y1="205" x2="366" y2="146"/>
    <line x1="205" y1="307" x2="146" y2="366"/>
    <line x1="307" y1="307" x2="366" y2="366"/>
  </g>

  <!-- Peripheral nodes -->
  <g filter="url(#shadow)">
    <!-- Top -->
    <circle cx="256" cy="100" r="28" fill="url(#innerGrad)"/>
    <circle cx="256" cy="100" r="18" fill="url(#nodeGrad1)" opacity="0.8"/>
    <!-- Bottom -->
    <circle cx="256" cy="412" r="28" fill="url(#innerGrad)"/>
    <circle cx="256" cy="412" r="18" fill="url(#nodeGrad2)" opacity="0.8"/>
    <!-- Left -->
    <circle cx="100" cy="256" r="28" fill="url(#innerGrad)"/>
    <circle cx="100" cy="256" r="18" fill="url(#nodeGrad1)" opacity="0.8"/>
    <!-- Right -->
    <circle cx="412" cy="256" r="28" fill="url(#innerGrad)"/>
    <circle cx="412" cy="256" r="18" fill="url(#nodeGrad2)" opacity="0.8"/>
    <!-- Corners -->
    <circle cx="146" cy="146" r="20" fill="url(#innerGrad)"/>
    <circle cx="146" cy="146" r="12" fill="url(#nodeGrad1)" opacity="0.7"/>
    <circle cx="366" cy="146" r="20" fill="url(#innerGrad)"/>
    <circle cx="366" cy="146" r="12" fill="url(#nodeGrad2)" opacity="0.7"/>
    <circle cx="146" cy="366" r="20" fill="url(#innerGrad)"/>
    <circle cx="146" cy="366" r="12" fill="url(#nodeGrad2)" opacity="0.7"/>
    <circle cx="366" cy="366" r="20" fill="url(#innerGrad)"/>
    <circle cx="366" cy="366" r="12" fill="url(#nodeGrad1)" opacity="0.7"/>
  </g>

  <!-- Small decorative dots -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="70" cy="70" r="6"/>
    <circle cx="442" cy="70" r="6"/>
    <circle cx="70" cy="442" r="6"/>
    <circle cx="442" cy="442" r="6"/>
    <circle cx="180" cy="64" r="4"/>
    <circle cx="332" cy="64" r="4"/>
    <circle cx="64" cy="180" r="4"/>
    <circle cx="64" cy="332" r="4"/>
    <circle cx="448" cy="180" r="4"/>
    <circle cx="448" cy="332" r="4"/>
    <circle cx="180" cy="448" r="4"/>
    <circle cx="332" cy="448" r="4"/>
  </g>

  <!-- "S" monogram in center -->
  <text x="256" y="272" font-family="Quicksand, Noto Sans SC, sans-serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.95">S</text>
</svg>