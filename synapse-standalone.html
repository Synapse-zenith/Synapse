<title>Synapse · 个人电子工作台</title>





<style>
/* ====== Synapse Global Styles ====== */


:root {
  /* 主色调 - 浅紫 + 淡蓝 */
  --purple-light: #d4c5f0;
  --purple: #b8a9d4;
  --purple-mid: #9b8ec4;
  --purple-deep: #7b6db0;
  --blue-light: #c5e3f0;
  --blue: #a8d8ea;
  --blue-mid: #8cc8e0;
  --blue-deep: #6ab0cc;
  --gradient-primary: linear-gradient(135deg, #d4c5f0, #a8d8ea);
  --gradient-card: linear-gradient(135deg, rgba(212,197,240,0.25), rgba(168,216,234,0.25));
  --gradient-glow: linear-gradient(135deg, rgba(212,197,240,0.4), rgba(168,216,234,0.4));
  
  /* 背景 */
  --bg-primary: #f5f0ff;
  --bg-secondary: #eef7fc;
  --bg-card: rgba(255,255,255,0.75);
  --bg-card-hover: rgba(255,255,255,0.9);
  --bg-glass: rgba(255,255,255,0.6);
  
  /* 文字 */
  --text-primary: #3d3660;
  --text-secondary: #6b6490;
  --text-muted: #9b94b8;
  --text-white: #faf8ff;
  
  /* 功能色 */
  --success: #7ecba1;
  --warning: #f0c78e;
  --danger: #f0a0a8;
  --info: #8ec8f0;
  
  /* 尺寸 */
  --sidebar-width: 280px;
  --topbar-height: 56px;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  
  /* 阴影 */
  --shadow-sm: 0 2px 8px rgba(155,142,196,0.12);
  --shadow-md: 0 4px 16px rgba(155,142,196,0.15);
  --shadow-lg: 0 8px 32px rgba(155,142,196,0.18);
  --shadow-glow: 0 0 24px rgba(168,216,234,0.3);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Noto Sans SC', 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

/* 滚动条美化 */
::-webkit-scrollbar {
  width: 4px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--purple-light);
  border-radius: 4px;
}

/* 通用按钮 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  outline: none;
}
.btn:active {
  transform: scale(0.96);
}
.btn-primary {
  background: var(--gradient-primary);
  color: var(--text-white);
  box-shadow: var(--shadow-md);
}
.btn-secondary {
  background: var(--bg-glass);
  color: var(--text-primary);
  border: 1.5px solid var(--purple-light);
}
.btn-sm {
  padding: 8px 16px;
  font-size: 13px;
  border-radius: var(--radius-sm);
}

/* 卡片 */
.card {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(212,197,240,0.2);
  transition: all 0.3s ease;
}
.card:active {
  transform: scale(0.98);
}

/* 标签 */
.tag {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  background: var(--gradient-card);
  color: var(--purple-deep);
}

/* 输入框 */
.input {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--purple-light);
  border-radius: var(--radius-sm);
  background: var(--bg-glass);
  font-family: inherit;
  font-size: 14px;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.3s;
}
.input:focus {
  border-color: var(--blue-mid);
  box-shadow: 0 0 0 3px rgba(168,216,234,0.2);
}

textarea.input {
  resize: vertical;
  min-height: 80px;
}

/* 动画 */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.fade-in { animation: fadeIn 0.5s ease forwards; }
.fade-in-up { animation: fadeInUp 0.5s ease forwards; }

.hidden { display: none !important; }

/* ====== 开屏页面 ====== */
.splash-screen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  max-width: 480px;
  margin: 0 auto;
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.splash-screen.exit {
  opacity: 0;
  transform: scale(1.05);
  pointer-events: none;
}

.splash-bg {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #e8e0f8 0%, #d4ecf8 40%, #f0ebff 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.splash-stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.splash-star {
  position: absolute;
  width: 4px;
  height: 4px;
  background: rgba(255,255,255,0.8);
  border-radius: 50%;
  animation: pulse 2s ease infinite;
}

.splash-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
  padding: 40px 24px;
  z-index: 2;
  animation: fadeInUp 0.8s ease;
}

.splash-logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.splash-logo-svg {
  width: 80px;
  height: 80px;
  animation: float 3s ease-in-out infinite;
}
.splash-title {
  font-family: 'Quicksand', sans-serif;
  font-size: 36px;
  font-weight: 700;
  background: linear-gradient(135deg, #9b8ec4, #6ab0cc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px;
}
.splash-subtitle {
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 400;
  letter-spacing: 4px;
}

.splash-quote-card {
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: var(--radius-xl);
  padding: 28px 24px;
  text-align: center;
  max-width: 320px;
  border: 1px solid rgba(212,197,240,0.3);
  box-shadow: 0 8px 32px rgba(155,142,196,0.12);
}

.splash-flowers {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 16px;
}
.splash-flowers.bottom {
  margin-bottom: 0;
  margin-top: 16px;
}
.flower {
  font-size: 22px;
  animation: float 2.5s ease-in-out infinite;
}
.flower.small { font-size: 16px; animation-delay: 0.5s; }
.flower:nth-child(2) { animation-delay: 0.3s; }
.flower:nth-child(3) { animation-delay: 0.6s; }
.flower:nth-child(4) { animation-delay: 0.9s; }
.flower:nth-child(5) { animation-delay: 0.2s; }

.splash-quote-text {
  font-size: 16px;
  line-height: 1.8;
  color: var(--text-primary);
  font-weight: 500;
}

.splash-enter-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 36px;
  border: none;
  border-radius: 50px;
  background: var(--gradient-primary);
  color: var(--text-white);
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(155,142,196,0.3);
  transition: all 0.3s ease;
  animation: fadeInUp 0.6s ease 0.3s both;
}
.splash-enter-btn:active {
  transform: scale(0.95);
  box-shadow: 0 2px 12px rgba(155,142,196,0.2);
}

/* ====== 主应用布局 ====== */
.main-app {
  position: fixed;
  inset: 0;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: linear-gradient(180deg, #f5f0ff 0%, #eef7fc 100%);
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 顶部栏 */
.topbar {
  height: var(--topbar-height);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(212,197,240,0.15);
  z-index: 100;
}
.topbar-menu-btn {
  width: 40px;

  border: none;
  border-radius: var(--radius-sm);
  background: rgba(212,197,240,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.2s;
}
.topbar-menu-btn:active {
  background: rgba(212,197,240,0.3);
}
.topbar-title {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
}
.topbar-date {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
}

/* 页面容器 */
.page-container {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px;
}

/* 页面通用样式 */
.page {
  display: none;
  animation: fadeIn 0.4s ease;
}
.page.active {
  display: block;
}

.page-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.page-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 16px;
}

/* ====== 首页 ====== */
.home-grid {

  gap: 16px;

/* 待办分区 */
.todo-section {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(212,197,240,0.15);
}
.todo-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.todo-title {
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.todo-count {
  font-size: 12px;
  color: var(--text-muted);
  background: rgba(212,197,240,0.2);
  padding: 2px 10px;
  border-radius: 12px;
}
.todo-add-btn {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 50%;
  background: var(--gradient-primary);
  color: white;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
}
.todo-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.todo-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: rgba(212,197,240,0.08);

}
.todo-check {
  width: 22px;
  height: 22px;
  border: 2px solid var(--purple-light);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;
  transition: all 0.2s;
}
.todo-check.done {
  background: var(--success);

}
.todo-check.done::after {
  content: '✓';
  color: white;
  font-size: 13px;

}
.todo-text {
  flex: 1;
  font-size: 14px;
  color: var(--text-primary);
}
.todo-text.done {

}
.todo-delete {

  color: var(--text-muted);

}
.todo-delete:active {
  background: rgba(240,160,168,0.2);
  color: var(--danger);
}
.todo-input-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.todo-input-row .input {
  flex: 1;
}
.todo-section-divider {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
  padding: 8px 0 4px;

}

/* 身体状态 */
.body-status {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  border-radius: var(--radius-lg);

}
.body-status-title {

}
.body-status-grid {

.body-stat-item {

  gap: 6px;

  border-radius: var(--radius-sm);

}
.body-stat-icon {

}
.body-stat-label {

}
.body-stat-value {
  font-size: 14px;

}
.body-stat-editable {

}
.body-stat-editable:active {

}
.body-stat-editable::after {

/* 快捷入口 */

.quick-entry:active {

function addTodo() {
  const input = document.getElementById('todoInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  STATE.todos.unshift({ text, done: false, date: new Date().toISOString() });
  saveState('todos');
  input.value = '';
  loadPage('home');
}

function toggleTodo(idx) {
  STATE.todos[idx].done = !STATE.todos[idx].done;
  saveState('todos');
  loadPage('home');
}

function deleteTodo(idx) {
  STATE.todos.splice(idx, 1);
  saveState('todos');
  loadPage('home');
}

}

function getTodayWords() {
  const today = new Date().toDateString();
  const storedDate = localStorage.getItem('synapse_wordDate');
  const storedWords = JSON.parse(localStorage.getItem('synapse_todayWords') || 'null');
  
  if (storedDate === today && storedWords) return storedWords;
  
  // Fisher-Yates 洗牌，保证真随机
  const pool = [...WORD_BANK];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const selected = pool.slice(0, Math.min(STATE.wordCount, WORD_BANK.length));
  localStorage.setItem('synapse_wordDate', today);
  localStorage.setItem('synapse_todayWords', JSON.stringify(selected));
  return selected;
}

function selectMood(mood) {
  const today = new Date().toDateString();
  STATE.todayMood = mood;
  localStorage.setItem('synapse_todayMood', mood);
  localStorage.setItem('synapse_moodDate', today);
  
  // 如果今天已经记录过，替换而不是新增
  const existingIdx = STATE.moodHistory.findIndex(h => h.date === today);
  if (existingIdx > -1) {
    STATE.moodHistory[existingIdx].mood = mood;
  } else {
    STATE.moodHistory.unshift({ mood, date: today });
  }
  if (STATE.moodHistory.length > 60) STATE.moodHistory = STATE.moodHistory.slice(0, 60);
  saveState('moodHistory');
  loadPage('mood');
}

function deleteMoodRecord(idx) {
  if (confirm('确定删除这条心情记录吗？')) {
    STATE.moodHistory.splice(idx, 1);
    // 如果删除的是今天的，清除今日心情
    const today = new Date().toDateString();
    const remaining = STATE.moodHistory.find(h => h.date === today);
    if (!remaining) {
      STATE.todayMood = null;
      localStorage.removeItem('synapse_todayMood');
      localStorage.removeItem('synapse_moodDate');
    }
    saveState('moodHistory');
    loadPage('mood');
  }
}

              <div class="note-actions">
                ${!n.summary ? `<button class="note-summarize-btn" onclick="summarizeNote(${i})">生成总结</button>` : ''}

function addPaperNote() {
  const input = document.getElementById('paperInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  STATE.paperNotes.unshift({ date: new Date().toLocaleDateString('zh-CN'), content: text, summary: generateSummary(text) });
  saveState('paperNotes');
  input.value = '';
  loadPage('notes');
}

function generateSummary(text) {
  if (text.length <= 50) return text;
  const sentences = text.split(/[。！？\n]+/).filter(s => s.trim());
  if (sentences.length <= 1) return text.slice(0, 100) + (text.length > 100 ? '...' : '');
  return sentences.slice(0, Math.min(3, sentences.length)).join('。') + (sentences.length > 3 ? '……' : '');
}

function summarizeNote(idx) {
  STATE.paperNotes[idx].summary = generateSummary(STATE.paperNotes[idx].content);
  saveState('paperNotes');
  loadPage('notes');
}

function deletePaperNote(idx) {
  STATE.paperNotes.splice(idx, 1);

      ${STATE.readingList.map((book, bi) => `
        <div class="reading-card">
          <div class="reading-book-name">${book.name}</div>
          <div class="reading-author">${book.author}</div>
          <div class="reading-progress-row">
            <span style="font-size:12px;color:var(--text-muted)">阅读进度</span>
            <div class="reading-progress-bar"><div class="reading-progress-fill" style="width:${book.progress}%"></div></div>
            <span class="reading-progress-text">${book.progress}%</span>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <input type="number" class="input" id="readingProgress${bi}" placeholder="更新进度 %" style="width:100px;padding:6px 10px;font-size:13px" min="0" max="100">
            <button class="btn btn-primary btn-sm" onclick="updateReadingProgress(${bi})">更新</button>
          </div>
          ${book.excerpts && book.excerpts.length > 0 ? `<div style="font-size:14px;font-weight:700;margin:10px 0 6px;color:var(--text-primary)">📝 摘抄</div>${book.excerpts.map(e => `<div class="reading-excerpt"><div class="reading-excerpt-label">摘录</div><div>${escapeHtml(e)}</div></div>`).join('')}` : ''}
          ${book.notes ? `<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--purple-deep);margin-bottom:4px">💭 读书笔记</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.7">${escapeHtml(book.notes)}</div></div>` : ''}
          <div style="margin-top:10px">
            <textarea class="input" id="readingExcerpt${bi}" placeholder="添加新摘抄..." rows="2" style="font-size:13px"></textarea>
            <button class="btn btn-secondary btn-sm" onclick="addExcerpt(${bi})" style="margin-top:6px">添加摘抄</button>
          </div>
        </div>`).join('')}
      <div class="reading-card" style="margin-top:16px">
        <div style="font-size:15px;font-weight:700;margin-bottom:10px">➕ 添加新书</div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">书名</label><input class="input" id="newBookName" placeholder="书名"></div>
          <div class="form-group"><label class="form-label">作者</label><input class="input" id="newBookAuthor" placeholder="作者"></div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="addNewBook()" style="margin-top:8px">添加</button>
      </div>
    </div>`;
}

function updateReadingProgress(bi) {
  const input = document.getElementById('readingProgress' + bi);
  if (!input) return;
  const val = parseInt(input.value);
  if (isNaN(val) || val < 0 || val > 100) return;
  STATE.readingList[bi].progress = val;
  saveState('readingList');
  input.value = '';
  loadPage('reading');
}

function addExcerpt(bi) {
  const input = document.getElementById('readingExcerpt' + bi);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  if (!STATE.readingList[bi].excerpts) STATE.readingList[bi].excerpts = [];
  STATE.readingList[bi].excerpts.push(text);
  saveState('readingList');
  input.value = '';
  loadPage('reading');
}

function addNewBook() {
  const name = document.getElementById('newBookName')?.value.trim();
  const author = document.getElementById('newBookAuthor')?.value.trim();
  if (!name || !author) return;
  STATE.readingList.push({ name, author, progress: 0, excerpts: [], notes: '' });
  saveState('readingList');
  loadPage('reading');
}

// ====== 灵感白板 ======
function renderWhiteboard(container) {
  container.innerHTML = `
    <div class="module-page fade-in">
      <div class="whiteboard-input-area">
        <div style="font-size:15px;font-weight:700;margin-bottom:10px">💡 记录灵感</div>
        <textarea class="input" id="ideaInput" placeholder="写下你的突发想法、碎片思绪..." rows="3"></textarea>
        <button class="btn btn-primary btn-sm" onclick="addIdea()" style="margin-top:8px">记录灵感</button>
      </div>
      <div class="whiteboard-ideas" id="ideaList">
        ${STATE.whiteboardIdeas.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">💭</div><div class="empty-state-text">灵感还未降临，放松一下~</div></div>' :
          STATE.whiteboardIdeas.map((idea, i) => `<div class="idea-card"><div class="idea-time">${idea.date}</div><div class="idea-text">${escapeHtml(idea.text)}</div><button class="idea-delete" onclick="deleteIdea(${i})">×</button></div>`).join('')}
      </div>
    </div>`;
}

function addIdea() {
  const input = document.getElementById('ideaInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  STATE.whiteboardIdeas.unshift({ date: new Date().toLocaleString('zh-CN'), text });
  saveState('whiteboardIdeas');
  input.value = '';
  loadPage('whiteboard');
}

function deleteIdea(idx) {
  STATE.whiteboardIdeas.splice(idx, 1);
  saveState('whiteboardIdeas');
  loadPage('whiteboard');
}

// ====== 生活备忘 ======
function renderMemo(container) {
  container.innerHTML = `
    <div class="module-page fade-in">
      <div class="module-header"><div class="module-title">📌 生活备忘</div><div class="module-desc">零散琐事，随手��录</div></div>
      <div style="margin-bottom:16px">
        <div class="todo-input-row">
          <input class="input" id="memoInput" placeholder="记录零散琐事..." onkeydown="if(event.key==='Enter')addMemo()">
          <button class="btn btn-primary btn-sm" onclick="addMemo()">记录</button>
        </div>
      </div>
      <div class="memo-list" id="memoList">
        ${STATE.memos.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">📎</div><div class="empty-state-text">暂无备忘，一切井井有条~</div></div>' :
          STATE.memos.map((m, i) => `<div class="memo-card"><span class="memo-pin">📌</span><div class="memo-body"><div class="memo-text">${escapeHtml(m.text)}</div><div class="memo-date">${m.date}</div></div><button class="memo-delete" onclick="deleteMemo(${i})">×</button></div>`).join('')}
      </div>
    </div>`;
}

function addMemo() {
  const input = document.getElementById('memoInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  STATE.memos.unshift({ text, date: new Date().toLocaleDateString('zh-CN') });
  saveState('memos');
  input.value = '';
  loadPage('memo');
}

function deleteMemo(idx) {
  STATE.memos.splice(idx, 1);
  saveState('memos');
  loadPage('memo');
}

// ====== 工具函数 ======
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}


</script>
</body>
</html>
